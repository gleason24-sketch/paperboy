name: CI
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix packages/engine
      - run: npm ci --prefix packages/cli
      - run: npm ci --prefix packages/db
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack the CLI (dry run)
        run: npm pack --dry-run --prefix packages/cli

  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Banned strings, ids and dashes
        run: npm run scrub
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build the image
        run: docker build -t paperboy-ci .
