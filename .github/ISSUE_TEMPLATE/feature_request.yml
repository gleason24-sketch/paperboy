name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fact check
        - Topic selection
        - Publishing adapters
        - Self-host and Docker
        - CLI
        - MCP
        - REST API
        - Docs
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would be willing to send a pull request for this.
