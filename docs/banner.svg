  <text x="168" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F7F4ED">Paperboy</text>
  <text x="72" y="228" font-family="Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#F7F4ED">Every claim checked against</text>
  <text x="72" y="296" font-family="Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#F7F4ED">its source before it ships.</text>
  <text x="72" y="352" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9FB0C3">Open-source SEO article engine. Reads Search Console,</text>
